name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / Python 3.13
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade pip

      - name: Install BIDR Sanitizer
        run: |
          python -m pip install -e ".[all,dev,web-api]"

      - name: Check installed dependencies
        run: |
          python -m pip check

      - name: Run unit tests
        run: |
          python -m pytest -q

      - name: Check public repository tree
        run: |
          python scripts/check_public_tree.py

      - name: Build distributions
        run: |
          python -m build

      - name: Verify models are not bundled
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem `
            ".\models" `
            -Recurse `
            -File |
            Where-Object {
              $_.Name -notin @(
                "README.md",
                "manifest.json"
              )
            }

          if ($forbidden) {
            $forbidden |
              ForEach-Object {
                Write-Error "Unexpected model file: $($_.FullName)"
              }

            exit 1
          }

  web:
    name: Ubuntu / Node.js 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Type-check web client
        run: npm run typecheck

      - name: Test web client
        run: npm test

      - name: Build static web client
        run: npm run build
